# Blended effective take rates for CEX revenue estimation (work order 7, §2b). These are
# ESTIMATES of the realised fee as a fraction of notional, after the maker/taker mix, VIP
# tiers and native-token discounts that a real book of flow sees — NOT the headline taker
# fee. Every revenue figure built from these carries revenue_quality = estimated and a wide
# error bar (lo/hi). Only venues the system collects wash-filtered volume for produce a
# revenue estimate; the rest show n/a. Reviewed with the public fee schedules.
