_doc: 'Freshness contract (work order 6, A2). Every processed table: cadence, budget (hours), owning job, source or derived
  (parent named), time column. status.json is written from this by every job; freshness.assert_job fails a job whose table
  breaches its budget or whose derived table lags its parent by more than one period. Ages are measured on the data''s time
  column, never on fetched_at.'
