# Universe and tiering (notes Section 2). Reviewed with the weekly job; membership history is stored.
version: 1
as_of: 2026-09-06
candidate_universe:
  source: coingecko            # fallback: coinpaprika
  top_n_by_market_cap: 200
  pages: 2                     # 250 per page; we take the top 200 after exclusions
exclusions:
  # Category rules are regexes matched against CoinGecko category names (verified list,
  # tests/fixtures/live_verification/coingecko.categories.json.gz). Stablecoins are kept in the
  # `stablecoins` table for Section 7; never in a tier.
  # Category membership lists fetched daily with one call each (`coins/markets?category=`),
  # so exclusions are known for every candidate from the first run; the regexes below apply
  # to the slower per-coin metadata and catch anything the lists miss.
  stablecoin_category_ids: [stablecoins]
  wrapped_or_lst_category_ids: [wrapped-tokens, liquid-staking-tokens, liquid-restaking-tokens, tokenized-btc, bridged-tokens]
  stablecoin_category_regex: '^(?!Stablecoin Issuer$)(?!Stable Ecosystem$)(.* Stablecoin|Stablecoins)$'
  wrapped_or_lst_category_regex: '^(Wrapped-Tokens|Tokenized BTC|Bridged-Tokens|Bridged .*|Liquid Staked .*|Liquid Restaked .*|Liquid Staking Tokens|Liquid Restaking Tokens)$'
  # exchange-internal tokens with no external markets (hand list, reviewed weekly)
  exchange_internal_ids: []
  # explicit overrides after review (coingecko id -> reason); reason "include" forces inclusion
  manual: {}
tier_rules:
  tier1:
    perp_venues_required: 2                # of {binance, bybit, okx}
    oi_30d_median_usd_min: 150_000_000     # aggregate across the three venues
    depth_2pct_usd_min: 3_000_000          # intraday median of aggregated D(0.02)
    # Reasoning: the notes ask for 15–25 names with "real depth at 2 percent of several
    # million USD". On the first live run (2026-09-06, one day of OI) USD 100M aggregate OI
    # admitted 30 names and USD 150M admitted 22, so 150M is the level that lands in the
    # notes' range before the depth screen (which can only remove names). USD 3M depth is
    # the lower edge of "several million". Changing either is a governance event recorded
    # in docs/changelog.md; they are not tuned to any backtest.
  tier2:
    spot_venues_required: 2                # of {binance, bybit, okx, coinbase, kraken}
    adv_real_30d_usd_min: 10_000_000       # wash-filtered 30-day ADV
  tier3: remainder
recompute: weekly                          # notes say monthly; build prompt says weekly (prompt wins on engineering)
sector_map:
  version: 1
  reviewed_on: null                        # set when the aggregator seed is reviewed (phase 2)
  sectors: [L1, L2, DeFi-lending, DEX, derivatives-protocol, oracle-infra, stablecoin, RWA, AI-compute, memecoin, gaming, exchange-token, payments, other]
  assignments: {}                          # coingecko id -> sector, filled in phase 2
stablecoins: []                            # filled from DefiLlama in phase 4
symbol_map: {}                             # coingecko id -> {binance: BTCUSDT, bybit: BTCUSDT, okx: BTC-USDT, coinbase: BTC-USD, kraken: XBTUSD}
