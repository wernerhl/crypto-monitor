[project]
name = "crypto-monitor"
version = "0.1.0"
description = "Risk-and-context monitor for a tiered crypto asset universe (not an alpha engine, not investment advice)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars==1.44.1",
    "duckdb==1.5.5",
    "pydantic==2.13.5",
    "typer==0.27.2",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "numpy==2.5.2",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "scikit-learn==1.9.0",
    "tenacity==9.1.4",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
    "hypothesis==6.167.1",
    "pre-commit==4.6.2",
]

[project.scripts]
monitor = "monitor.cli:app"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF"]
ignore = ["E501", "RUF012", "N803", "N806", "B905", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits real endpoints; run with LIVE=1",
]
filterwarnings = ["ignore::DeprecationWarning"]
