name: election-venues
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  push:
    branches: [main, election-venues]
    paths:
      - ".github/workflows/election-venues.yml"
      - "config.json"
permissions:
  contents: write
  actions: write
concurrency:
  group: election-venues
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: election-venues
          fetch-depth: 1
      - name: sample for five hours and commit each sample
        run: |
          git config user.name "election-venues-bot"
          git config user.email "election-venues-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 18000 ))
          while :; do
            git pull -q --rebase origin election-venues || true
            python3 collect.py || echo "::warning::collector exited with an error"
            git add data state.json latest.json
            if ! git diff --cached --quiet; then
              git commit -q -m "samples $(date -u +%Y-%m-%dT%H:%MZ)"
              git push -q origin HEAD:election-venues || { git pull -q --rebase origin election-venues && git push -q origin HEAD:election-venues; } || echo "::warning::push failed, the next sample retries it"
            fi
            now=$(date +%s)
            if python3 -c "import collect, sys; sys.exit(0 if collect.in_event(collect.now()) else 1)"; then
              wait=5
            else
              wait=$(( 600 - now % 600 ))
            fi
            if [ $(( now + wait )) -ge "$end" ]; then break; fi
            sleep "$wait"
          done
      - name: start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then sleep 120; fi
          for i in 1 2 3 4 5; do
            gh workflow run election-venues.yml --repo "${{ github.repository }}" --ref main && exit 0
            sleep 30
          done
          exit 1
