name: weekly
on:
  schedule:
    - cron: "40 2 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: data-write
  cancel-in-progress: false
env:
  COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      rotate: ${{ steps.rotate.outcome }}
      size: ${{ steps.size.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: universe, tier freeze, factor model, screens, risk panels, studies
        run: uv run monitor compute weekly
      - name: rotate raw files older than the retention windows to the data-archive branch
        id: rotate
        # non-fatal here: a failed archive push used to skip the commit below and discard the
        # weekly outputs (5 weeks, 27 Sep-1 Nov 2026). The script puts every raw file back on
        # failure; the run is reddened at the end, after the outputs are committed and deployed.
        continue-on-error: true
        run: bash scripts/rotate_raw.sh
      - name: commit data as the bot
        run: |
          git config user.name "crypto-monitor-bot"
          git config user.email "crypto-monitor-bot@users.noreply.github.com"
          git add -A data/ site/data/
          if ! git diff --cached --quiet; then
            uv run python scripts/check_write_set.py weekly
            git commit -m "data: weekly $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            if ! git pull --rebase origin main; then
              echo "::error::rebase conflict; binary data is never auto-resolved. Conflicting files: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              git rebase --abort
              exit 1
            fi
            git push origin HEAD:main
          fi
      - name: open the weekly review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/weekly_issue.sh
      - run: uv run monitor site render --no-meta
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: repo-size check (non-fatal in this job; the checks job reddens the run after deploy)
        id: size
        # a failure here used to fail this job, and `deploy` and `freshness-gate` (needs: weekly) were
        # then skipped: the 27-Sep-2026 outputs were committed but never published
        continue-on-error: true
        run: bash scripts/check_repo_size.sh
  deploy:
    needs: weekly
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  freshness-gate:
    needs: [weekly, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # read the bot's just-pushed data commit, not the dispatch sha (frozen data)
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: freshness gate (reddens the run if a weekly-owned table is stale; does NOT block deploy, which already ran)
        run: uv run monitor freshness-gate weekly
  checks:
    # runs after deploy so a rotation or size failure reddens the run without blocking publication
    needs: [weekly, deploy]
    if: ${{ always() && needs.weekly.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: raw rotation and repo size (reported by the weekly job)
        env:
          ROTATE: ${{ needs.weekly.outputs.rotate }}
          SIZE: ${{ needs.weekly.outputs.size }}
        run: |
          rc=0
          if [ "$ROTATE" = failure ]; then echo "::error::raw rotation to data-archive failed; raw files were kept on main (weekly job, rotate step)"; rc=1; fi
          if [ "$SIZE" = failure ]; then echo "::error::repository size over the limit (weekly job, repo-size step; docs/runbook.md 'Repository size')"; rc=1; fi
          exit $rc
