name: daily
on:
  schedule:
    - cron: "25 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "refetch even if today's raw files exist"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
concurrency:
  group: data-write
  cancel-in-progress: false
env:
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
  COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
  GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
  BEACONCHAIN_API_KEY: ${{ secrets.BEACONCHAIN_API_KEY }}
  TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: fetch daily datasets (idempotent per day)
        run: uv run monitor fetch daily ${{ inputs.force && '--force' || '' }}
      - name: compute processed tables from raw files (daily + hourly derived + risk)
        run: uv run monitor compute daily
      - name: commit data as the bot
        id: commit
        run: |
          git config user.name "crypto-monitor-bot"
          git config user.email "crypto-monitor-bot@users.noreply.github.com"
          git add data/ site/data/ site/alerts.xml 2>/dev/null || git add data/ site/data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            uv run python scripts/check_write_set.py daily
            git commit -m "data: daily $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            if ! git pull --rebase origin main; then
              echo "::error::rebase conflict; binary data is never auto-resolved. Conflicting files: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              git rebase --abort
              exit 1
            fi
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: render site
        run: uv run monitor site render
        env:
          GIT_SHA: ${{ steps.commit.outputs.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: daily
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-pages:
    needs: [daily, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check the live page carries this build's sha
        run: bash scripts/verify_pages.sh "${{ needs.deploy.outputs.page_url || 'https://wernerhl.github.io/crypto-monitor/' }}" "${{ needs.daily.outputs.sha }}"
