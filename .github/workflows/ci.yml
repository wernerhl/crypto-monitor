name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "site/data/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check_secrets.py $(git ls-files)
      - run: uv run pytest
      - name: rendered site scripts parse (node --check)
        run: uv run monitor site render --no-meta && uv run python scripts/check_site_js.py site
      - name: no automatic merge resolution in any workflow or script
        run: |
          if grep -rnE --exclude=ci.yml -- '-X (theirs|ours)|--strategy-option[= ](theirs|ours)|-Xtheirs|-Xours' .github/workflows scripts; then
            echo "::error::a workflow or script auto-resolves merge conflicts; binary data must never be auto-resolved"; exit 1; fi
        env:
          LIVE: "0"
      - run: bash scripts/check_repo_size.sh
