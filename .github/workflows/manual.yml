name: manual
on:
  workflow_dispatch:
    inputs:
      job:
        description: "which job to run"
        type: choice
        options: [daily, hourly, weekly, backfill]
        default: daily
      start_date:
        description: "backfill start (YYYY-MM-DD)"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: data-write
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: run job
        run: |
          case "${{ inputs.job }}" in
            backfill) uv run monitor backfill --start "${{ inputs.start_date }}" ;;
            *) uv run monitor fetch "${{ inputs.job }}" && uv run monitor compute "${{ inputs.job }}" ;;
          esac
      - name: commit data as the bot
        run: |
          git config user.name "crypto-monitor-bot"
          git config user.email "crypto-monitor-bot@users.noreply.github.com"
          git add data/ site/data/
          if ! git diff --cached --quiet; then
            uv run python scripts/check_write_set.py "${{ inputs.job }}"
            git commit -m "data: manual ${{ inputs.job }} $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            if ! git pull --rebase origin main; then
              echo "::error::rebase conflict; binary data is never auto-resolved. Conflicting files: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
              git rebase --abort
              exit 1
            fi
            git push origin HEAD:main
          fi
