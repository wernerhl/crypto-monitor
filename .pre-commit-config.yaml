repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: scan staged files for API-key patterns
        entry: python scripts/check_secrets.py
        language: system
        pass_filenames: true
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
