<!doctype html>
<html lang="en" data-build-sha="{{ git_sha }}" data-built-at="{{ built_at }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Crypto risk-and-context monitor{% endblock %}</title>
<style>
:root{--bg:#fafafa;--fg:#1a1a1a;--muted:#666;--line:#ddd;--stale:#999;--warn:#b8860b;--bad:#b00020;--ok:#2e7d32}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#e6e6e6;--muted:#9a9a9a;--line:#333;--stale:#666}}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header,main,footer{max-width:1200px;margin:0 auto;padding:12px 16px}
header{border-bottom:1px solid var(--line)} nav a{margin-right:14px}
h1{font-size:1.3rem;margin:.2em 0} h2{font-size:1.1rem;border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:28px}
.panel{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:12px 0}
.meta{color:var(--muted);font-size:.85em} .stale{opacity:.55} .badge{display:inline-block;padding:0 6px;border-radius:4px;font-size:.8em;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.9em;overflow-x:auto;display:block} th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.85em}
a{color:inherit}
</style>
</head>
<body>
<header>
<h1>Crypto risk-and-context monitor</h1>
<nav><a href="index.html">Front page</a><a href="universe.html">Universe</a><a href="methods.html">Methods</a><a href="status.html">Data status</a><a href="https://github.com/wernerhl/crypto-monitor">Code</a></nav>
<div class="meta">Built {{ built_at }} · commit <code>{{ git_sha[:12] }}</code> · v{{ version }}</div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
<p><strong>Notice.</strong> {{ notice }}</p>
<p>No tracking. The only external request this page makes is to the Plotly CDN.</p>
</footer>
</body>
</html>
